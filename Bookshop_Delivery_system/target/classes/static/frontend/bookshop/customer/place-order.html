<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order - BookShop</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/blue-theme.css">
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <h1 class="nav-logo">BookShop</h1>
        <ul class="nav-menu">
            <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="books.html" class="nav-link">Books</a></li>
            <li class="nav-item"><a href="orders.html" class="nav-link">Orders</a></li>
            <li class="nav-item"><a href="place-order.html" class="nav-link active">Checkout</a></li>
        </ul>
    </div>
</nav>

<section class="place-order-page">
    <div class="container" style="padding: 2rem;">
        <div class="page-header">
            <h1>Checkout</h1>
            <p>Review your cart and place order</p>
        </div>

        <div class="content-wrapper" style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
            <div class="main-content">
                <div class="card" style="background:#fff; padding:20px; border-radius:8px;">
                    <h2 style="color:#333; margin-bottom:15px;">Shipping Details</h2>
                    <form id="orderForm">
                        <div style="margin-bottom:15px;">
                            <label style="display:block; margin-bottom:5px;">Address</label>
                            <input type="text" id="address" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;" required>
                        </div>
                        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
                            <div>
                                <label style="display:block; margin-bottom:5px;">City</label>
                                <input type="text" id="city" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;" required>
                            </div>
                            <div>
                                <label style="display:block; margin-bottom:5px;">State</label>
                                <input type="text" id="state" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;" required>
                            </div>
                            <div>
                                <label style="display:block; margin-bottom:5px;">ZIP</label>
                                <input type="text" id="zipCode" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;" required>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="sidebar-wrapper">
                <div class="card" style="background:#f8f9fa; padding:20px; border-radius:8px; border:1px solid #ddd;">
                    <h3 style="color:#333; border-bottom:1px solid #ddd; padding-bottom:10px; margin-bottom:15px;">Your Cart</h3>

                    <div id="orderItemsContainer">
                        <p>Loading cart...</p>
                    </div>

                    <div style="margin-top:20px; border-top:2px solid #333; padding-top:10px; font-size:1.2rem; font-weight:bold; display:flex; justify-content:space-between;">
                        <span>Total:</span>
                        <span id="grandTotal">$0.00</span>
                    </div>

                    <button id="placeOrderBtn" class="btn-primary" style="width:100%; margin-top:20px; padding:12px; background-color:#2563eb; color:white; border:none; border-radius:5px; cursor:pointer;">
                        Confirm Order
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="js/api.js"></script>
<script src="js/place-order.js"></script>
</body>
</html>
