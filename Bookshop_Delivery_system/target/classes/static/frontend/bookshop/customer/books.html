<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Books - Bookshop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #0f1014; color: white; display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background-color: #1a1a2e; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid #2a2d3e; flex-shrink: 0; }
        .sidebar a { text-decoration: none; color: #a0c0ff; padding: 12px; border-radius: 8px; background-color: #10235d ;display: flex; align-items: center; gap: 10px; }
        .sidebar a:hover, .sidebar a.active { background-color: #3b82f6; color: white; border-left: 4px solid #3a6df0; }

        .main-content { flex-grow: 1; padding: 30px; }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }

        .book-card { background: #10235d; border: 1px solid #2a2d3e; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; }
        .book-card img { width: 100%; height: 260px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
        .book-card h3 { font-size: 1rem; margin: 0 0 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .book-card .price { font-size: 1.1rem; color: #3a6df0; font-weight: bold; margin-bottom: 10px; }
        .btn-add { background: transparent; border: 1px solid #3a6df0; color: #3a6df0; padding: 8px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; }
        .btn-add:hover { background: #3b82f6;; color: white; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="text-align:center;">BookShop</h2>
    <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
    <a href="orders.html"><i class="fas fa-box"></i> My Orders</a>
    <a href="cart.html">
        <i class="fas fa-shopping-cart"></i> Cart
        <span id="cart-count" style="background:red; padding:2px 6px; border-radius:50%; font-size:12px; margin-left:auto; display:none;">0</span>
    </a>
</div>

<div class="main-content">
    <h2 style="margin-bottom: 20px;">Our Collection</h2>
    <div id="books-container" class="book-grid">
        <p>Loading books...</p>
    </div>
</div>

<script src="/frontend/bookshop/customer/js/books.js"></script>
</body>
</html>
