<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BookShop</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../components.css">
    <link rel="stylesheet" href="../auth.css">
    <link rel="stylesheet" href="../blue-theme.css">
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <h1 class="nav-logo">BookShop</h1>
        <ul class="nav-menu">
            <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="login.html" class="nav-link">Login</a></li>
        </ul>
    </div>
</nav>

<section class="register-section">
    <div class="container">
        <div class="form-container">
            <h2>Create an Account</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" name="name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="role" class="form-label">I want to register as a:</label>
                    <select id="role" name="role" class="form-input">
                        <option value="CUSTOMER" selected>Customer (Buy Books)</option>
                        <option value="BOOKSELLER">Bookseller (Sell Books)</option>
                        <option value="DELIVERY_PERSON">Delivery Person (Deliver Orders)</option>
                    </select>
                </div>

                <div class="form-group password-toggle">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required>
                    <button type="button" class="password-toggle-btn">Show</button>
                </div>
                <div class="form-group password-toggle">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" required>
                    <button type="button" class="password-toggle-btn">Show</button>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
                </div>
                <div class="form-group">
                    <p>Already have an account? <a href="login.html">Login here</a></p>
                </div>
            </form>
        </div>
    </div>
</section>

<footer class="footer">
    <div class="container">
        <p>&copy; 2025 BookShop. All rights reserved.</p>
    </div>
</footer>

<script src="js/auth.js"></script>
</body>
</html>
