<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Login - BookShop</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../components.css">
    <link rel="stylesheet" href="../auth.css">
    <link rel="stylesheet" href="../blue-theme.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-logo">BookShop Delivery</h1>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="login.html" class="nav-link active">Login</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Login Form Section -->
    <section class="login-section">
        <div class="container">
            <div class="form-container">
                <h2>Delivery Person Login</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="employeeId" class="form-label">Employee ID</label>
                        <input type="text" id="employeeId" name="employeeId" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary btn-block">Login</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 BookShop. All rights reserved.</p>
        </div>
    </footer>

    <script src="../auth.js"></script>
</body>
</html>
