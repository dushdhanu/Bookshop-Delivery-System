<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookseller Login - BookShop</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../components.css">
    <link rel="stylesheet" href="../auth.css">
    <link rel="stylesheet" href="../blue-theme.css">
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <h1 class="nav-logo">BookShop Bookseller</h1>
        <ul class="nav-menu">
            <li class="nav-item"><a href="../index.html" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="login.html" class="nav-link active">Login</a></li>
        </ul>
    </div>
</nav>

<section class="login-section">
    <div class="container">
        <div class="form-container">
            <h2>Bookseller Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block">Login to Dashboard</button>
                </div>
                <div class="form-group">
                    <p>Not a bookseller yet? <a href="../customer/register.html">Register here</a></p>
                </div>
            </form>
        </div>
    </div>
</section>

<footer class="footer">
    <div class="container"><p>&copy; 2025 BookShop. All rights reserved.</p></div>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                handleBooksellerLogin();
            });
        }
    });

    async function handleBooksellerLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const submitButton = document.querySelector('#loginForm .btn');
        const originalText = submitButton.textContent;

        submitButton.textContent = 'Logging in...';
        submitButton.disabled = true;

        try {
            const response = await fetch('http://localhost:8080/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const contentType = response.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                throw new Error("Server Error: Received non-JSON response.");
            }

            const data = await response.json();

            if (response.ok) {
                if (data.role !== 'BOOKSELLER' && data.role !== 'ADMIN') {
                    throw new Error('Access Denied: This portal is for Booksellers only.');
                }
                localStorage.setItem('jwt_token', data.token);
                localStorage.setItem('user_role', data.role);
                window.location.href = 'index.html';
            } else {
                throw new Error(data.message || 'Login failed');
            }
        } catch (error) {
            showAlert(error.message, 'danger');
            submitButton.textContent = originalText;
            submitButton.disabled = false;
        }
    }

    function showAlert(message, type) {
        const existing = document.querySelector('.alert');
        if (existing) existing.remove();
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type}`;
        alertDiv.textContent = message;
        document.querySelector('.form-container').insertBefore(alertDiv, document.querySelector('#loginForm'));
        setTimeout(() => alertDiv.remove(), 5000);
    }
</script>
</body>
</html>
