<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BookShop</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../components.css">
    <link rel="stylesheet" href="../auth.css">
    <link rel="stylesheet" href="../blue-theme.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
    /* Custom SweetAlert2 Theme to match BookShop */
    .swal2-popup {
        background-color: #1a1a2e !important;
        color: #ffffff !important;
        border: 1px solid #2e5a8a !important;
        border-radius: 10px !important;
    }
    .swal2-title, .swal2-html-container {
        color: #ffffff !important;
    }
    .swal2-input, .swal2-textarea {
        background-color: #10235d !important;
        color: #ffffff !important;
        border: 1px solid #3b82f6 !important;
    }
    .swal2-confirm {
        background-color: #3b82f6 !important;
    }
    .swal2-cancel {
        background-color: #475569 !important;
    }
</style>
<script>
    // Global alert override
    window.alert = function(msg) {
        Swal.fire({
            text: msg,
            confirmButtonColor: '#3b82f6',
            background: '#1a1a2e',
            color: '#ffffff'
        });
    };
</script>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-logo">BookShop</h1>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="books.html" class="nav-link">Books</a>
                </li>
                <li class="nav-item">
                    <a href="orders.html" class="nav-link">Orders</a>
                </li>
                <li class="nav-item">
                    <a href="profile.html" class="nav-link">Profile</a>
                </li>
                <li class="nav-item">
                    <a href="login.html" class="nav-link active">Login</a>
                </li>
                <li class="nav-item">
                    <a href="register.html" class="nav-link">Register</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Login Form Section -->
    <section class="login-section">
        <div class="container">
            <div class="form-container">
                <h2>Login to Your Account</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" name="email" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary btn-block">Login</button>
                    </div>
                    <div class="form-group">
                        <p>Don't have an account? <a href="register.html">Register here</a></p>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 BookShop. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script src="../validation.js"></script>
    <script src="../session.js?v=3"></script>
</body>
</html>
