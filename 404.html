<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - BookShop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="blue-theme.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
    /* Custom SweetAlert2 Theme to match BookShop */
    .swal2-popup {
        background-color: #1a1a2e !important;
        color: #ffffff !important;
        border: 1px solid #2e5a8a !important;
        border-radius: 10px !important;
    }
    .swal2-title, .swal2-html-container {
        color: #ffffff !important;
    }
    .swal2-input, .swal2-textarea {
        background-color: #10235d !important;
        color: #ffffff !important;
        border: 1px solid #3b82f6 !important;
    }
    .swal2-confirm {
        background-color: #3b82f6 !important;
    }
    .swal2-cancel {
        background-color: #475569 !important;
    }
</style>
<script>
    // Global alert override
    window.alert = function(msg) {
        Swal.fire({
            text: msg,
            confirmButtonColor: '#3b82f6',
            background: '#1a1a2e',
            color: '#ffffff'
        });
    };
</script>
</head>
<body>
    <!-- Navigation Bar -->
    @@include('navbar.html')

    <!-- 404 Page Content -->
    <section class="error-page">
        <div class="container">
            <div class="error-content">
                <div class="error-image">
                    <div class="book-stack">
                        <div class="book"></div>
                        <div class="book"></div>
                        <div class="book"></div>
                    </div>
                </div>
                <h1 class="error-title">404</h1>
                <h2 class="error-subtitle">Page Not Found</h2>
                <p class="error-message">Oops! The page you're looking for seems to have gone missing, just like a book in a library.</p>
                <div class="error-actions">
                    <a href="index.html" class="btn btn-primary">Go Home</a>
                    <a href="books.html" class="btn btn-secondary">Browse Books</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    @@include('footer.html')

    <script src="main.js"></script>
    <script src="session.js?v=3"></script>
</body>
</html>
