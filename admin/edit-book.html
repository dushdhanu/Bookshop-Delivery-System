<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book - BookShop Admin</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../components.css">
    <link rel="stylesheet" href="../blue-theme.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
    /* Custom SweetAlert2 Theme to match BookShop */
    .swal2-popup {
        background-color: #1a1a2e !important;
        color: #ffffff !important;
        border: 1px solid #2e5a8a !important;
        border-radius: 10px !important;
    }
    .swal2-title, .swal2-html-container {
        color: #ffffff !important;
    }
    .swal2-input, .swal2-textarea {
        background-color: #10235d !important;
        color: #ffffff !important;
        border: 1px solid #3b82f6 !important;
    }
    .swal2-confirm {
        background-color: #3b82f6 !important;
    }
    .swal2-cancel {
        background-color: #475569 !important;
    }
</style>
<script>
    // Global alert override
    window.alert = function(msg) {
        Swal.fire({
            text: msg,
            confirmButtonColor: '#3b82f6',
            background: '#1a1a2e',
            color: '#ffffff'
        });
    };
</script>
</head>
<body>
    <!-- Admin Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-logo">BookShop Admin</h1>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a href="books.html" class="nav-link">Books</a>
                </li>
                <li class="nav-item">
                    <a href="orders.html" class="nav-link">Orders</a>
                </li>
                <li class="nav-item">
                    <a href="profile.html" class="nav-link">Profile</a>
                </li>
               
            </ul>
        </div>
    </nav>

    <!-- Edit Book Page Content -->
    <section class="edit-book-page">
        <div class="container">
            <div class="page-header">
                <h1>Edit Book</h1>
                <p>Update book information</p>
            </div>

            <div class="content-wrapper">
                <!-- Sidebar -->
                <div class="sidebar-wrapper">
                    <aside class="sidebar">
                        <h3 class="sidebar-title">Admin Panel</h3>
                        <ul class="sidebar-list">
                            <li class="sidebar-item">
                                <a href="index.html" class="sidebar-link">Dashboard</a>
                            </li>
                            <li class="sidebar-item">
                                <a href="books.html" class="sidebar-link">Manage Books</a>
                            </li>
                            <li class="sidebar-item">
                                <a href="add-book.html" class="sidebar-link">Add New Book</a>
                            </li>
                            <li class="sidebar-item">
                                <a href="orders.html" class="sidebar-link">Orders</a>
                            </li>
                            <li class="sidebar-item">
                                <a href="profile.html" class="sidebar-link">Admin Profile</a>
                            </li>
                        </ul>
                    </aside>
                </div>

                <!-- Main Content -->
                <div class="main-content">
                    <div class="form-container">
                        <form id="editBookForm">
                            <div class="form-group">
                                <label for="bookTitle" class="form-label">Book Title</label>
                                <input type="text" id="bookTitle" name="bookTitle" class="form-input" value="The Great Gatsby" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="author" class="form-label">Author</label>
                                <input type="text" id="author" name="author" class="form-input" value="F. Scott Fitzgerald" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="isbn" class="form-label">ISBN</label>
                                <input type="text" id="isbn" name="isbn" class="form-input" value="978-0-7432-7356-5">
                            </div>
                            
                            <div class="form-group">
                                <label for="category" class="form-label">Category</label>
                                <select id="category" name="category" class="form-input" required>
                                    <option value="">Select a category</option>
                                    <option value="fiction" selected>Fiction</option>
                                    <option value="non-fiction">Non-Fiction</option>
                                    <option value="science-fiction">Science Fiction</option>
                                    <option value="mystery">Mystery & Thriller</option>
                                    <option value="romance">Romance</option>
                                    <option value="biography">Biography</option>
                                    <option value="history">History</option>
                                    <option value="self-help">Self-Help</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="price" class="form-label">Price ($)</label>
                                <input type="number" id="price" name="price" class="form-input" value="12.99" step="0.01" min="0" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="stock" class="form-label">Stock Quantity</label>
                                <input type="number" id="stock" name="stock" class="form-input" value="25" min="0" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="description" class="form-label">Description</label>
                                <textarea id="description" name="description" class="form-input" rows="5">A classic American novel set in the Jazz Age, exploring themes of wealth, love, and the American Dream through the eyes of the mysterious Jay Gatsby.</textarea>
                            </div>
                            
                            <div class="form-group">
                                <label for="bookImage" class="form-label">Book Cover Image</label>
                                <input type="file" id="bookImage" name="bookImage" class="form-input">
                                <div class="image-preview">
                                    <div class="book-image-placeholder-large"></div>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <div class="form-checkbox">
                                    <input type="checkbox" id="featured" name="featured">
                                    <label for="featured">Featured Book</label>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <div class="form-checkbox">
                                    <input type="checkbox" id="active" name="active" checked>
                                    <label for="active">Active (Visible to customers)</label>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <button type="submit" class="btn btn-primary">Update Book</button>
                                <a href="books.html" class="btn btn-secondary">Cancel</a>
                                <button type="button" class="btn btn-danger" id="deleteBtn">Delete Book</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 BookShop. All rights reserved.</p>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let originalBook = null;
            const bookToEditStr = localStorage.getItem('bookToEdit');
            if (bookToEditStr) {
                try {
                    originalBook = JSON.parse(bookToEditStr);
                    const titleEl = document.getElementById('bookTitle');
                    if (titleEl) titleEl.value = originalBook.title;
                    
                    const authorEl = document.getElementById('author');
                    if (authorEl) authorEl.value = originalBook.author;
                    
                    const isbnEl = document.getElementById('isbn');
                    if (isbnEl) isbnEl.value = originalBook.isbn || '';
                    
                    const priceEl = document.getElementById('price');
                    if (priceEl && originalBook.price) {
                        let p = originalBook.price.toString().replace('$', '').trim();
                        priceEl.value = p;
                    }
                    
                    const stockEl = document.getElementById('stock');
                    if (stockEl) stockEl.value = originalBook.stock || 0;
                } catch(e) {}
            }
            
            const editBookForm = document.getElementById('editBookForm');
            if (editBookForm) {
                editBookForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    
                    if (originalBook) {
                        let myBooks = JSON.parse(localStorage.getItem('myBooks')) || [];
                        const index = myBooks.findIndex(b => b.title?.trim().toLowerCase() === originalBook.title?.trim().toLowerCase() && b.author?.trim().toLowerCase() === originalBook.author?.trim().toLowerCase());
                        
                        const newTitle = document.getElementById('bookTitle')?.value || originalBook.title;
                        const newAuthor = document.getElementById('author')?.value || originalBook.author;
                        const newIsbn = document.getElementById('isbn')?.value || originalBook.isbn;
                        const newPrice = document.getElementById('price')?.value || originalBook.price;
                        const newStock = document.getElementById('stock')?.value || originalBook.stock;
                        
                        const updatedBook = {
                            title: newTitle,
                            author: newAuthor,
                            isbn: newIsbn,
                            price: newPrice,
                            stock: parseInt(newStock) || 0
                        };
                        
                        if (index !== -1) {
                            myBooks[index] = updatedBook;
                        } else {
                            // fallback if not found, just push it (though it should be found)
                            myBooks.push(updatedBook);
                        }
                        localStorage.setItem('myBooks', JSON.stringify(myBooks));
                    }
                    
                    const btn = editBookForm.querySelector('button[type="submit"]');
                    const origText = btn.textContent;
                    btn.textContent = 'Updating...';
                    
                    setTimeout(() => {
                        btn.textContent = origText;
                        if (typeof Swal !== 'undefined') {
                            Swal.fire({
                                text: 'Book updated successfully!',
                                icon: 'success',
                                background: '#1a1a2e',
                                color: '#ffffff',
                                confirmButtonColor: '#3b82f6'
                            }).then(() => {
                                window.location.href = 'books.html';
                            });
                        } else {
                            alert('Book updated successfully!');
                            window.location.href = 'books.html';
                        }
                    }, 500);
                });
            }
            
            
            const cancelBtn = document.getElementById('cancelBtn');
            if (cancelBtn) {
                cancelBtn.addEventListener('click', () => {
                    window.location.href = 'books.html';
                });
            }
            
            // Delete button logic
            const deleteBtn = document.getElementById('deleteBtn');
            if (deleteBtn) {
                deleteBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (typeof Swal !== 'undefined') {
                        Swal.fire({
                            title: 'Confirmation',
                            text: 'Are you sure you want to delete this book? This action cannot be undone.',
                            icon: 'warning',
                            showCancelButton: true,
                            confirmButtonColor: '#3b82f6',
                            cancelButtonColor: '#ef4444',
                            confirmButtonText: 'Yes, Delete it'
                        }).then((result) => {
                            if (result.isConfirmed) {
                                if (originalBook) {
                                    let myBooks = JSON.parse(localStorage.getItem('myBooks')) || [];
                                    myBooks = myBooks.filter(b => !(b.title?.trim().toLowerCase() === originalBook.title?.trim().toLowerCase() && b.author?.trim().toLowerCase() === originalBook.author?.trim().toLowerCase()));
                                    localStorage.setItem('myBooks', JSON.stringify(myBooks));
                                }
                                Swal.fire({
                                    text: 'Book deleted successfully!',
                                    icon: 'success',
                                    background: '#1a1a2e',
                                    color: '#ffffff',
                                    confirmButtonColor: '#3b82f6'
                                }).then(() => {
                                    window.location.href = 'books.html';
                                });
                            }
                        });
                    } else {
                        if (confirm('Are you sure you want to delete this book?')) {
                            if (originalBook) {
                                let myBooks = JSON.parse(localStorage.getItem('myBooks')) || [];
                                myBooks = myBooks.filter(b => !(b.title?.trim().toLowerCase() === originalBook.title?.trim().toLowerCase() && b.author?.trim().toLowerCase() === originalBook.author?.trim().toLowerCase()));
                                localStorage.setItem('myBooks', JSON.stringify(myBooks));
                            }
                            alert('Book deleted successfully!');
                            window.location.href = 'books.html';
                        }
                    }
                });
            }
        });
    </script>
    <script src="../session.js?v=3"></script>
</body>
</html>
